asyncapi: '3.0.0'

info:
  title: Warm House Identity Outbound Kafka API
  version: '1.0.0'
  description: Асинхронный Warm House Identity Outbound Kafka API.

servers:
  production:
    host: localhost:9092
    protocol: kafka
    description: Kafka server

channels:
  usersRegistered:
    address: warmhouse.identity.users.registered
    messages:
      UserRegistered:
        $ref: '#/components/messages/UserRegistered'
    description: Очередь событий регистрации пользователей

operations:
  publishUserRegistered:
    action: send
    channel: 
       $ref: '#/channels/usersRegistered'
    summary: Публикация события регистрации ползователя
    description: Сервис warmhouse.identity публикует событие регистрации ползователя

components:
  messages:
    UserRegistered:
      name: UserRegistered
      title: Регистрация пользователя
      summary: Событие регистрации ползователя
      contentType: 'application/json'
      payload:
        type: 'object'
        properties:
        $ref: '#/components/schemas/UserRegisteredPayload'

  schemas: 
    UserRegisteredPayload:
        type: 'object'
        properties:
          Id:
            type: 'string'
            description: 'Идентифкатор события'
          When:
            type: 'string'
            description: 'Время события'
          payload:
            type: 'object'
            properties:
              UserName:
                type: 'string'
                description: 'Имя пользователя'
              Email:
                type: 'string'
                description: 'Email'
              PhoneNumber:
                type: 'string'
                description: 'Phone'
              RegisteredAt:
                type: 'string'
                description: 'Дата и время регистрации'
              IP:
                type: 'string'
                description: 'IP адрес последнего входа в систему'